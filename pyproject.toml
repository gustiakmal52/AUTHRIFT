[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authrift"
version = "0.1.0"
description = "API Authorization Differential Tester"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "AUTHRIFT Contributors" },
]
keywords = ["security", "authorization", "api-testing", "bola", "idor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "uvicorn>=0.29",
    "fastapi>=0.111",
    "ruff>=0.4",
]

[project.scripts]
authrift = "authrift.cli:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
